name: CDK Diff (PR)

# NOTE: no `paths:` filter here. This check is required by branch
# protection on main, so it must run (and report a status) for every PR,
# not just ones touching infra/ — otherwise GitHub blocks merges forever
# waiting on a status that never gets reported. Instead, the job always
# runs but skips the actual `cdk diff` work when no infra files changed.
on:
  pull_request:

permissions:
  id-token: write       # Required for OIDC token exchange
  contents: read
  pull-requests: write  # Required to post diff as PR comment

jobs:
  cdk-diff:
    name: CDK Infrastructure Diff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for infra changes
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(infra/|\.github/workflows/cdk-diff\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: infra
        run: npm ci

      - name: Audit dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: infra
        # Plain `npm audit --audit-level=high` doesn't work here long-term:
        # aws-cdk-lib ships minimatch (and its own nested brace-expansion)
        # as a bundleDependency — literal files in its published tarball,
        # not resolved through npm's dependency graph — so neither
        # `npm audit fix` nor a root `overrides` entry can touch it, only
        # a new aws-cdk-lib release can. scripts/check-audit.mjs exempts
        # only findings whose *every* install path is under aws-cdk-lib's
        # own node_modules; anything else (a real finding in a dependency
        # this repo controls) still fails the build.
        run: node scripts/check-audit.mjs

      - name: Build CDK app
        if: steps.changes.outputs.run == 'true'
        working-directory: infra
        run: npm run build

      - name: Lint
        if: steps.changes.outputs.run == 'true'
        working-directory: infra
        run: npm run lint

      # Dependabot-authored PRs never get the credentialed steps below,
      # regardless of what changed: GitHub strips secrets and OIDC token
      # permissions from pull_request runs triggered by dependabot[bot],
      # as an anti-exfiltration measure — see
      # https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/automate-dependabot-with-actions#investigating-failed-workflow-runs
      # ("secrets are available in Dependabot secrets rather than as
      # GitHub Actions secrets"). configure-aws-credentials can therefore
      # never authenticate on these runs. The build/audit steps above
      # still run for Dependabot PRs that touch infra/, so a dependency
      # bump that breaks `tsc` or introduces a critical vuln still fails
      # this required check — only the actual `cdk diff` (which needs
      # both AWS creds and OTP_* secrets) is skipped, since a dependency
      # bump alone can't produce CloudFormation drift. The PR diff itself
      # is still human-reviewed before merge.
      - name: Configure AWS credentials (OIDC)
        if: steps.changes.outputs.run == 'true' && github.actor != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CDK_DIFF_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run CDK diff
        if: steps.changes.outputs.run == 'true' && github.actor != 'dependabot[bot]'
        id: cdk-diff
        working-directory: infra
        env:
          OTP_ADMIN_EMAIL: ${{ secrets.OTP_ADMIN_EMAIL }}
          OTP_HMAC_SECRET: ${{ secrets.OTP_HMAC_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # This is a "Use this template" clone of developer-experience-concepts
          # deployed as its own, independent copy of ResumeSiteStack (see that
          # class's doc comment) -- these overrides are what keep it from
          # targeting the original repo's stack/domain/roles. Without them,
          # bin/resume-site.ts's defaults point straight at ResumeSiteStack.
          STACK_NAME: ExampleGoldenPathStack
          SITE_DOMAIN_NAME: example.pages-enterprise.com
          GITHUB_OIDC_PROVIDER_ARN: arn:aws:iam::315326805073:oidc-provider/token.actions.githubusercontent.com
          GITHUB_ROLE_NAME_PREFIX: github-actions-example-golden-path
          GITHUB_REPO_NAME: example-golden-path
        run: |
          # Capture diff output; exit 0 even if there are changes (exit 1 = changes, 2 = error)
          DIFF_OUTPUT=$(npx cdk diff 2>&1 || true)
          echo "diff_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post CDK diff as PR comment
        if: steps.changes.outputs.run == 'true' && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v9
        env:
          DIFF_OUTPUT: ${{ steps.cdk-diff.outputs.diff_output }}
        with:
          script: |
            const diff = process.env.DIFF_OUTPUT;
            const body = [
              '## CDK Infrastructure Diff',
              '',
              'The following infrastructure changes are proposed by this PR:',
              '',
              '```',
              diff,
              '```',
              '',
              '_Review carefully before merging. This diff is generated by `cdk diff` against the currently deployed stack._',
            ].join('\n');

            // Find existing comment and update, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## CDK Infrastructure Diff')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
