<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Raymond Page – invite-only résumé and developer experience portfolio. Engineering Leader, Developer Experience &amp; Platform Strategy." />
  <title>Sign in — Raymond Page</title>
  <!--
    Link previews (Teams, Slack, Outlook, LinkedIn) never see the gated
    pages — the session-check function redirects every unauthenticated
    fetch here — so this page's Open Graph tags are the ones that
    actually render when a link to any part of the site is shared.
  -->
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Raymond Page – Developer Experience" />
  <meta property="og:description" content="Invite-only résumé and developer experience portfolio: Engineering Leader, Developer Experience &amp; Platform Strategy." />
  <meta property="og:url" content="https://resume.pages-enterprise.com/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Raymond Page – Developer Experience" />
  <meta name="twitter:description" content="Invite-only résumé and developer experience portfolio: Engineering Leader, Developer Experience &amp; Platform Strategy." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a4e8a'/%3E%3Ctext x='50' y='68' font-family='Arial,sans-serif' font-size='52' font-weight='700' fill='%23fff' text-anchor='middle'%3ERP%3C/text%3E%3C/svg%3E" />
  <!--
    Intentionally self-contained (no external CSS/JS): this page is the
    one path exempted from the session-check CloudFront Function, so it
    must render correctly on its own without depending on any other
    gated asset. See infra/cloudfront-functions/session-check.js.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-bg: #ffffff;
      --color-surface: #f7f8fa;
      --color-border: #e2e5ea;
      --color-text: #1a1d23;
      --color-text-muted: #5a6170;
      --color-accent: #1a4e8a;
      --color-accent-hover: #153e6e;
      --color-error: #a3262c;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --radius: 6px;
      --shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    html { font-size: 16px; }
    body {
      font-family: var(--font-sans);
      color: var(--color-text);
      background: var(--color-surface);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    main {
      width: 100%;
      max-width: 380px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; }
    input[type="email"], input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }
    button {
      width: 100%;
      padding: 0.65rem 1rem;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--color-accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary {
      background: none;
      color: var(--color-text-muted);
      margin-top: 0.75rem;
      font-size: 0.85rem;
      text-decoration: underline;
      padding: 0;
      width: auto;
    }
    button.secondary:hover { background: none; color: var(--color-text); }
    .message {
      font-size: 0.85rem;
      margin-bottom: 1rem;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius);
      display: none;
    }
    .message.visible { display: block; }
    .message.info { background: #eef3fa; color: var(--color-accent); }
    .message.error { background: #fbeaea; color: var(--color-error); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in required</h1>
    <p class="subtitle">This site is limited to invited visitors. Enter your email and we'll send you a one-time verification code.</p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="request-form">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required />
      <button type="submit" id="request-submit">Send code</button>
    </form>

    <form id="verify-form" hidden>
      <label for="code">Verification code</label>
      <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required />
      <button type="submit" id="verify-submit">Verify</button>
      <button type="button" class="secondary" id="start-over">Use a different email</button>
    </form>
  </main>

  <script>
    (function () {
      'use strict';

      var requestForm = document.getElementById('request-form');
      var verifyForm = document.getElementById('verify-form');
      var messageEl = document.getElementById('message');
      var emailInput = document.getElementById('email');
      var codeInput = document.getElementById('code');
      var requestSubmit = document.getElementById('request-submit');
      var verifySubmit = document.getElementById('verify-submit');
      var startOverBtn = document.getElementById('start-over');

      var submittedEmail = '';

      function showMessage(text, kind) {
        messageEl.textContent = text;
        messageEl.className = 'message visible ' + kind;
      }

      function clearMessage() {
        messageEl.className = 'message';
        messageEl.textContent = '';
      }

      requestForm.addEventListener('submit', function (event) {
        event.preventDefault();
        clearMessage();
        submittedEmail = emailInput.value.trim();
        requestSubmit.disabled = true;

        fetch('/auth/request-code', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email: submittedEmail }),
        })
          .then(function (response) {
            return response.json().catch(function () { return {}; }).then(function (data) {
              if (!response.ok) {
                throw new Error(data && data.message ? data.message : 'Something went wrong sending the code. Please try again.');
              }
              requestForm.hidden = true;
              verifyForm.hidden = false;
              showMessage(data && data.message ? data.message : 'If that email is allowlisted, a verification code was sent. Check your inbox.', 'info');
              codeInput.focus();
            });
          })
          .catch(function (err) {
            showMessage(err && err.message ? err.message : 'Something went wrong sending the code. Please try again.', 'error');
          })
          .finally(function () {
            requestSubmit.disabled = false;
          });
      });

      verifyForm.addEventListener('submit', function (event) {
        event.preventDefault();
        clearMessage();
        verifySubmit.disabled = true;

        fetch('/auth/verify-code', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email: submittedEmail, code: codeInput.value.trim() }),
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error('invalid');
            }
            return response.json().catch(function () { return {}; });
          })
          .then(function () {
            window.location.href = '/';
          })
          .catch(function () {
            showMessage('That code is invalid or expired. Please try again.', 'error');
          })
          .finally(function () {
            verifySubmit.disabled = false;
          });
      });

      startOverBtn.addEventListener('click', function () {
        clearMessage();
        verifyForm.hidden = true;
        requestForm.hidden = false;
        codeInput.value = '';
        emailInput.focus();
      });
    })();
  </script>
</body>
</html>
